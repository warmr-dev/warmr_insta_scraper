; Alembic configuration.
;
; NOTE: sqlalchemy.url is deliberately left blank here. migrations/env.py sets it
; from stories_monitor.config.get_settings().database_url so that the database URL
; lives in the environment only (SPEC section 4: secrets from env vars only).

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
version_path_separator = os
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
