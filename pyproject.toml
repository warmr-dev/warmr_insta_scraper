[project]
name = "ai-stories-scraper"
version = "0.1.0"
description = "Instagram Stories Monitor - watches ~57k accounts for new stories via shared reels_tray polling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "instagrapi>=2.1.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "redis>=5.2",
    "structlog>=24.4",
    "cryptography>=44.0",
    "httpx>=0.28",
    "pillow>=11.0",
    "pytesseract>=0.3.13",
    "anthropic>=0.40",
    "tenacity>=9.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[project.scripts]
stories = "stories_monitor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stories_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
