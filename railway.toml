# Railway: постоянный процесс с циклом раз в минуту.
#
# Миграции при старте НЕ выполняются - `alembic upgrade head` падал с
# "Can't locate revision '0002'", когда база оказывалась новее образа, и
# контейнер уходил в цикл падений. Схема меняется редко: применяйте вручную
# (`alembic upgrade head`) или задайте RUN_MIGRATIONS=true, тогда сбой миграции
# не остановит запуск.
#
# ВАЖНО: не задавайте `alembic upgrade head` в Start Command или Pre-deploy
# Command в интерфейсе Railway - именно так и появлялся цикл падений.

[build]
builder = "dockerfile"
# Не пересобирать Python из-за правок в дашборде. Без этого фильтра любой
# коммит в web/ перезапускал бы скрапер, теряя текущий цикл сбора.
watchPatterns = [
  "src/**",
  "scripts/**",
  "migrations/**",
  "fixtures/**",
  "pyproject.toml",
  "Dockerfile",
  "alembic.ini",
  "railway.toml",
]

[deploy]
# run_loop.py сам держит интервал (LOOP_INTERVAL_SEC, по умолчанию 60с),
# поэтому cron не нужен: процесс работает постоянно.
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
