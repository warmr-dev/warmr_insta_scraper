# Railway: запуск раз в минуту.
#
# Cron, а не постоянный процесс: скрипт делает один цикл и завершается.
# Всё состояние в Postgres, поэтому пропущенный запуск ничего не ломает -
# следующий подхватит.

[build]
builder = "dockerfile"

[deploy]
# Раз в минуту. Railway ждёт завершения предыдущего запуска, поэтому
# наложения циклов не будет.
cronSchedule = "* * * * *"
restartPolicyType = "never"
